name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI 机器上没有本地 .env，必须显式指向远端内容仓。
# 否则 source 会回落到仓库里提交的 shirone.content.json（../shirone-content 本地路径），
# 在 runner 上不存在 → content:sync 失败 → user-config.ts 缺失 → astro check/build 全挂。
env:
  CONTENT_REPO_URL: "https://x-access-token:${{ secrets.CONTENT_ACCESS_TOKEN }}@github.com/${{ github.repository_owner }}/shirone-content.git"
  CONTENT_REPO_REF: main

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync content
        run: pnpm content:sync

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm dlx svelte-check@4.7.6 --tsconfig ./tsconfig.json --threshold error

      - name: Validate atom manifest
        run: pnpm check:manifest

      # 主题单测有一条不变式：「仓库里已提交的空覆盖层」必须逐字节等于 generateModule([])。
      # 而 content:sync 会把 user-config.ts 写成带真实配置的版本，所以跑单测前先复位成空模板。
      # 必须放在 sync 之后：其余用例需要 src/content/ 已被物化，否则也会失败。
      - name: Reset config overlay to empty
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            import { EMPTY_MODULE } from './scripts/content/config-overlay.mjs';
            writeFileSync('src/user/user-config.ts', EMPTY_MODULE);
          "

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

  styles:
    name: Style regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright 的 webServer 直接跑 `pnpm astro dev`，绕过了 `pnpm dev` 里的 sync，
      # 所以必须在这里先把内容物化好，否则 user-config.ts 缺失会直接崩。
      - name: Sync content
        run: pnpm content:sync

      - name: Run style regressions
        run: pnpm exec playwright test tests/site/fonts.spec.ts tests/site/inline-code-emphasis.spec.ts
