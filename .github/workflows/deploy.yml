name: Deploy Shirone Blog

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # 内容仓 trigger-build.yml 派发过来的事件
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# peaceiris 要把产物推到 gh-pages 分支，必须是 write
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 私有内容仓：用 x-access-token 形式把凭据带进 URL
      CONTENT_REPO_URL: "https://x-access-token:${{ secrets.CONTENT_ACCESS_TOKEN }}@github.com/${{ github.repository_owner }}/shirone-content.git"
      # 优先锁定内容仓派发时携带的提交 SHA；push / 手动触发时回落到 main
      CONTENT_REPO_REF: ${{ github.event.client_payload.sha || 'main' }}
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull private content
        run: pnpm content:sync

      - name: Build
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
